# ===================================================================
# Help Desk / Ticket Management System Application Configuration
# ===================================================================

spring.application.name=helpdesk-ticket-management
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# NOTE: Replace 'YOUR_MYSQL_PASSWORD_HERE' with your actual MySQL password.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
# Automatically updates the database schema matching Java Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows formatted SQL queries executed by Hibernate in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-view setting
spring.jpa.open-in-view=false
